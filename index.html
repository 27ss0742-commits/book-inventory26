<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Book Inventory Prototype</title>
    <style>
        :root {
            --primary: #1a73e8;
            --primary-hover: #1557b0;
            --bg-light: #f8f9fa;
            --border-color: #dadce0;
            --text-dark: #202124;
            --text-muted: #5f6368;
        }

        * {
            box-sizing: border-box;
            font-family: 'Roboto', 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            color: var(--text-dark);
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Header Styles */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            background-color: var(--primary);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .logo-title {
            font-size: 22px;
            font-weight: 400;
        }

        .logo-title strong {
            font-weight: 500;
        }

        .badge {
            background-color: #e8f0fe;
            color: var(--primary);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .mode-toggle {
            display: flex;
            gap: 8px;
            background-color: var(--bg-light);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .mode-btn {
            padding: 6px 14px;
            border: none;
            background: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .mode-btn.active {
            background-color: var(--primary);
            color: white;
        }

        /* Main Sections */
        .section-card {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 24px;
            background-color: #ffffff;
        }

        .owner-only {
            display: block;
        }

        body.viewer-mode-active .owner-only {
            display: none !important;
        }

        /* Form Controls */
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn-primary {
            background-color: #a020f0;
            color: white;
        }

        .btn-primary:hover {
            background-color: #8018c0;
        }

        .btn-blue {
            background-color: var(--primary);
            color: white;
        }

        .btn-blue:hover {
            background-color: var(--primary-hover);
        }

        .btn-orange {
            background-color: #e67e22;
            color: white;
        }

        .btn-orange:hover {
            background-color: #d35400;
        }

        /* List Items */
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-bottom: 8px;
            background-color: #white;
        }

        .remove-item-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
        }

        .remove-item-btn:hover {
            color: #d93025;
        }

        /* Inventory Table Layout */
        .table-container {
            overflow-x: auto;
            margin-top: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th {
            background-color: var(--bg-light);
            color: var(--text-muted);
            font-weight: 500;
            padding: 12px 16px;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        .stock-bar-container {
            width: 120px;
            background-color: #f1f3f4;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            display: inline-block;
            margin-right: 8px;
            vertical-align: middle;
        }

        .stock-bar {
            height: 100%;
            background-color: #1e8e3e;
            width: 100%;
            transition: width 0.3s, background-color 0.3s;
        }

        .stock-bar.low {
            background-color: #f9ab00;
        }

        .stock-bar.out {
            background-color: #d93025;
            width: 0% !important;
        }

        .action-icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            padding: 4px 8px;
            color: var(--text-muted);
            border-radius: 4px;
        }

        .action-icon-btn:hover:not(:disabled) {
            background-color: #f1f3f4;
            color: var(--text-dark);
        }

        .action-icon-btn:disabled {
            color: #c1c4c8;
            cursor: not-allowed;
        }

        .trash-btn:hover:not(:disabled) {
            color: #d93025;
            background-color: #fce8e6;
        }

        /* Management Panel Specific Colors */
        .mgmt-card {
            border-top: 4px solid #f1c40f;
        }

        .mgmt-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .active-keys {
            margin-top: 15px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .key-tag {
            display: inline-flex;
            align-items: center;
            background-color: #fef7e0;
            color: #b06000;
            padding: 4px 8px;
            border-radius: 4px;
            margin-top: 6px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header Controls -->
    <header>
        <div class="logo-area">
            <div class="avatar">WW-P</div>
            <h1 class="logo-title">Google <strong>Book Inventory</strong></h1>
            <span class="badge">WW-P North</span>
        </div>
        <div class="mode-toggle">
            <button class="mode-btn" id="viewerModeBtn" onclick="setMode('viewer')">👁️ Viewer Mode</button>
            <button class="mode-btn active" id="ownerModeBtn" onclick="setMode('owner')">🔒 Owner Mode</button>
        </div>
    </header>

    <!-- Book Inventory Table Section -->
    <div class="section-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2 style="font-size: 18px; font-weight: 500;">Book Stock Management</h2>
            <button class="btn btn-primary owner-only" onclick="addSampleBook()" style="padding: 6px 12px; font-size: 12px;">+ Add 1984 Fast</button>
        </div>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Book Title</th>
                        <th>Available</th>
                        <th>Checked Out</th>
                        <th>Stock Availability</th>
                        <th class="owner-only">Owner Actions</th>
                    </tr>
                </thead>
                <tbody id="inventoryTableBody">
                    <!-- Dynamic rows populate here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Active Borrowers / Users Section -->
    <div class="section-card owner-only">
        <h2 style="font-size: 16px; font-weight: 500; margin-bottom: 15px;">Authorized System Names</h2>
        <div class="input-group">
            <input type="text" id="nameInput" placeholder="Enter full name...">
            <button class="btn btn-primary" onclick="addName()">+ Add</button>
        </div>
        <div id="namesListContainer">
            <!-- Dynamic names item list -->
        </div>
    </div>

    <!-- Passcode & Key Management Section -->
    <div class="section-card mgmt-card owner-only">
        <div class="mgmt-title">🔑 Passcode & Key Management</div>
        
        <div style="margin-bottom: 20px;">
            <label style="display:block; font-size:13px; color:var(--text-muted); margin-bottom:6px;">Viewer Mode Access Code</label>
            <div class="input-group" style="margin-bottom:0;">
                <input type="text" id="viewerCodeInput" value="read26">
                <button class="btn btn-blue" onclick="updateViewerCode()">Update Code</button>
            </div>
        </div>

        <div>
            <label style="display:block; font-size:13px; color:var(--text-muted); margin-bottom:6px;">Owner Passcode Key(s)</label>
            <div class="input-group" style="margin-bottom:0;">
                <input type="text" id="ownerKeyInput" placeholder="New key...">
                <button class="btn btn-orange" onclick="addOwnerKey()">Add Key</button>
            </div>
            <div class="active-keys">
                ACTIVE OWNER KEYS:
                <div id="keysContainer">
                    <!-- Dynamic tags -->
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // --- STATE INITIALIZATION & LOCALSTORAGE MANAGEMENT ---
    
    // Default system seed values if storage is totally empty
    const DEFAULT_BOOKS = [
        { id: "b1", title: "1984", available: 8, checkedOut: 0 },
        { id: "b2", title: "To Kill a Mockingbird", available: 4, checkedOut: 2 },
        { id: "b3", title: "The Great Gatsby", available: 0, checkedOut: 5 }
    ];

    const DEFAULT_NAMES = ["Alex Johnson", "Beatriz Silva", "Carlos Mendez", "Diana Prince"];
    const DEFAULT_KEYS = ["LA2627"];

    // State Objects
    let state = {
        mode: 'owner',
        books: JSON.parse(localStorage.getItem('lib_books')) || DEFAULT_BOOKS,
        names: JSON.parse(localStorage.getItem('lib_names')) || DEFAULT_NAMES,
        viewerCode: localStorage.getItem('lib_viewercode') || 'read26',
        ownerKeys: JSON.parse(localStorage.getItem('lib_ownerkeys')) || DEFAULT_KEYS
    };

    // Helper to persist updates permanently
    function saveState() {
        localStorage.setItem('lib_books', JSON.stringify(state.books));
        localStorage.setItem('lib_names', JSON.stringify(state.names));
        localStorage.setItem('lib_viewercode', state.viewerCode);
        localStorage.setItem('lib_ownerkeys', JSON.stringify(state.ownerKeys));
    }

    // --- VIEW INTERACTION & RENDERING LOGIC ---

    function setMode(mode) {
        state.mode = mode;
        document.getElementById('viewerModeBtn').classList.toggle('active', mode === 'viewer');
        document.getElementById('ownerModeBtn').classList.toggle('active', mode === 'owner');
        
        if(mode === 'viewer') {
            document.body.classList.add('viewer-mode-active');
        } else {
            document.body.classList.remove('viewer-mode-active');
        }
        renderAll();
    }

    function renderAll() {
        renderBooks();
        renderNames();
        renderKeys();
    }

    function renderBooks() {
        const tbody = document.getElementById('inventoryTableBody');
        tbody.innerHTML = '';

        state.books.forEach(book => {
            const total = book.available + book.checkedOut;
            const pct = total > 0 ? Math.round((book.available / total) * 100) : 0;
            
            let barClass = '';
            if (book.available === 0) barClass = 'out';
            else if (pct <= 30) barClass = 'low';

            // Constraint Check: Trash only functions if both fields are 0
            const canDelete = (book.available === 0 && book.checkedOut === 0);

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight: 500;">\${book.title}</td>
                <td>\${book.available}</td>
                <td>\${book.checkedOut}</td>
                <td>
                    <div class="stock-bar-container">
                        <div class="stock-bar \${barClass}" style="width: \${pct}%"></div>
                    </div>
                    <span style="font-size:12px; color:var(--text-muted)">\${pct}% \${book.available === 0 ? '(Out of Stock)' : ''}</span>
                </td>
                <td class="owner-only">
                    <button class="action-icon-btn" onclick="adjustStock('\${book.id}', 1)">➕</button>
                    <button class="action-icon-btn" onclick="adjustStock('\${book.id}', -1)" \${book.available <= 0 ? 'disabled' : ''}>➖</button>
                    <button class="action-icon-btn trash-btn" onclick="deleteBook('\${book.id}')" \${!canDelete ? 'disabled' : ''} title="\${canDelete ? 'Delete Book' : 'Cannot delete while stock or active loans exist'}">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function renderNames() {
        const container = document.getElementById('namesListContainer');
        container.innerHTML = '';
        state.names.forEach((name, idx) => {
            const item = document.createElement('div');
            item.className = 'list-item';
            item.innerHTML = `
                <span>\${name}</span>
                <button class="remove-item-btn" onclick="removeName(\${idx})">×</button>
            `;
            container.appendChild(item);
        });
    }

    function renderKeys() {
        const container = document.getElementById('keysContainer');
        container.innerHTML = '';
        state.ownerKeys.forEach(key => {
            const tag = document.createElement('span');
            tag.className = 'key-tag';
            tag.style.marginRight = '6px';
            tag.innerHTML = `⚠️ \${key}`;
            container.appendChild(tag);
        });
    }

    // --- DATA MUTATION ACTIONS ---

    function adjustStock(bookId, amount) {
        const book = state.books.find(b => b.id === bookId);
        if (book) {
            book.available = Math.max(0, book.available + amount);
            saveState();
            renderBooks();
        }
    }

    function deleteBook(bookId) {
        state.books = state.books.filter(b => b.id !== bookId);
        saveState();
        renderBooks();
    }

    function addSampleBook() {
        // Quick button to add back 1984 if deleted for test purposes
        if(!state.books.some(b => b.title === '1984')) {
            state.books.unshift({ id: 'b' + Date.now(), title: '1984', available: 8, checkedOut: 0 });
            saveState();
            renderBooks();
        }
    }

    function addName() {
        const input = document.getElementById('nameInput');
        const name = input.value.trim();
        if (name) {
            state.names.push(name);
            input.value = '';
            saveState();
            renderNames();
        }
    }

    function removeName(index) {
        state.names.splice(index, 1);
        saveState();
        renderNames();
    }

    function updateViewerCode() {
        const val = document.getElementById('viewerCodeInput').value.trim();
        if(val) {
            state.viewerCode = val;
            saveState();
            alert('Viewer Access Code successfully updated to: ' + val);
        }
    }

    document.getElementById('viewerCodeInput').value = state.viewerCode;

    function addOwnerKey() {
        const input = document.getElementById('ownerKeyInput');
        const key = input.value.trim().toUpperCase();
        if(key && !state.ownerKeys.includes(key)) {
            state.ownerKeys.push(key);
            input.value = '';
            saveState();
            renderKeys();
        }
    }

    // Initial View Run
    renderAll();
</script>

</body>
</html>
